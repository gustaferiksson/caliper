<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2b1d45"/>
      <stop offset="0.55" stop-color="#1a1029"/>
      <stop offset="1" stop-color="#0d0816"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.44" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#9437ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9437ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse"
                    x1="220" y1="220" x2="620" y2="804">
      <stop offset="0" stop-color="#d7a6ff"/>
      <stop offset="1" stop-color="#9437ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="92" y="92" width="840" height="840" rx="196" ry="196"/>
    </clipPath>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="92" y="92" width="840" height="840" fill="url(#aura)"/>
  </g>

  <!-- one diagonal dimension, flat ends square to the line -->
  <g stroke="url(#glyph)" fill="none" stroke-linecap="butt">
    <path d="M296 728 L 728 296" stroke-width="62"/>
    <path d="M220 652 L 372 804" stroke-width="50"/>
    <path d="M652 220 L 804 372" stroke-width="50"/>
  </g>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196" fill="url(#sheen)"/>
</svg>
