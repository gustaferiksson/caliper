name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gustaferiksson/macos-release/.github/workflows/release.yml@6d88888e7a9b6418de945c26f96a468a40075b9a # v0.1.0
    secrets: inherit
    with:
      name: Caliper
      app: .build/Caliper.app
      cask: caliper
      runner: macos-26
      build: |
        swift build -c release --product caliper
        ./bundle.sh release
